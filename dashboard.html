<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be Perfect CRM | لوحة التحكم</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/77D762Y/image.png">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* جميع أكواد CSS السابقة تبقى كما هي في ملف style.css */
        .notif-container { position: relative; }
        .notif-badge { position: absolute; top: -5px; left: -5px; background: #ff3b3b; color: white; border-radius: 50%; width: 20px; height: 20px; display: none; justify-content: center; align-items: center; font-size: 11px; font-weight: bold; }
        .notif-dropdown { position: absolute; top: 50px; left: 0; width: 300px; background: rgba(40, 40, 70, 0.95); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; z-index: 2000; display: none; max-height: 400px; overflow-y: auto; }
        .notif-item { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 14px; }
        .notif-item.unread { background: rgba(95, 211, 110, 0.1); }
        .btn-whatsapp { background: linear-gradient(to right, #25D366, #128C7E); color: white; padding: 10px 15px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; text-align: center; margin-top: 10px; }
        .admin-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px; }
        .admin-tab { background: transparent; border: none; color: #fff; opacity: 0.5; cursor: pointer; padding: 8px 16px; font-size: 14px; font-weight: 600; border-radius: 8px; transition: all 0.3s; }
        .admin-tab.active, .admin-tab:hover { opacity: 1; background: rgba(255,255,255,0.1); }
        .admin-tab-content { display: none; }
        .admin-tab-content.active { display: block; }
        .chat-container { position: relative; }
        .chat-box { flex: 1; overflow-y: auto; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 10px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        .chat-msg { padding: 8px 12px; border-radius: 10px; max-width: 80%; word-wrap: break-word; }
        .chat-msg.me { background: #2575fc; align-self: flex-end; }
        .chat-msg.other { background: rgba(255,255,255,0.1); align-self: flex-start; }
        .mention-dropdown { position: absolute; bottom: 65px; right: 0; width: 200px; background: rgba(40, 40, 70, 0.95); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; z-index: 1000; display: none; max-height: 150px; overflow-y: auto; }
        .mention-item { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .mention-item:hover { background: rgba(255,255,255,0.1); }
        .section-divider { margin: 25px 0; border: 0; border-top: 1px solid rgba(255,255,255,0.2); }
        .phone-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
        .phone-row input { flex: 1; }
        .phone-row .remove-phone { background: rgba(239, 71, 58, 0.3); color: #fff; border: none; border-radius: 8px; cursor: pointer; padding: 8px 12px; font-weight: bold; }
        .phone-row .wa-check { display: flex; align-items: center; gap: 5px; font-size: 13px; color: #25D366; }
        .filters-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        .filters-bar select, .filters-bar label { padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #fff; font-size: 13px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.2); }
        .filters-bar select option { color: #333; }
        .filters-bar label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .upload-preview { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; display: none; margin-top: 10px; }
        .upload-btn { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 8px; border-radius: 8px; cursor: pointer; text-align: center; margin-top: 5px; }
        .upload-btn:hover { background: rgba(255,255,255,0.2); }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 59, 59, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(255, 59, 59, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 59, 59, 0); } }
        .status-late { animation: pulse 2s infinite; border: 2px solid #ff3b3b !important; }
    </style>
</head>
<body class="dashboard-body">
    <!-- (هنا يوضع باقي كود الـ HTML الخاص بالواجهة كما في الردود السابقة، من التوب بار إلى نهاية النوافذ المنبثقة) -->
    <!-- ... الكود المختصر للتذكير، استخدم نفس كود الـ HTML السابق ... -->

    <!-- المكتبات يجب أن تكون هنا في نهاية الصفحة -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>

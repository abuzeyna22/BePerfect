<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be Perfect CRM | تسجيل الدخول</title>
    <!-- خطوط جوجل العربية -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- حاوية الإشعارات (Toast Notifications) -->
    <div id="toast-container"></div>

    <!-- شاشة تسجيل الدخول -->
    <div class="login-container">
        <div class="glass-card login-box">
            <!-- اللوجو -->
            <div class="logo-area">
                <img src="https://i.ibb.co/77D762Y/image.png" alt="Be Perfect Logo" class="logo">
                <h1>Be Perfect</h1>
                <p class="subtitle">نظام إدارة علاقات العملاء - الصحة النفسية</p>
            </div>

            <!-- نموذج الدخول -->
            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label for="username">اسم المستخدم</label>
                    <input type="text" id="username" placeholder="أدخل اسم المستخدم" required>
                </div>
                <div class="input-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
                </div>
                <button type="submit" id="loginBtn" class="btn-primary">
                    <span class="btn-text">تسجيل الدخول</span>
                    <div class="loader" id="loginLoader"></div>
                </button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
